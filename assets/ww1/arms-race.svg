<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img"><title>Die Spirale des Misstrauens</title><desc>Erklärungsmodell: Sicherheit für eine Seite kann die andere verunsichern.</desc><rect width="960" height="560" rx="22" fill="#f5f2eb"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="30" fill="#243349" font-weight="700">Die Spirale des Misstrauens</text><text x="40" y="85" font-size="17" fill="#5b6878" font-weight="400">Erklärungsmodell: Sicherheit für eine Seite kann die andere verunsichern.</text><rect x="35" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(178 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-30 28V-7L-10 4V-7L10 4V-27H23V28Z"/><path d="M-17 17H-10M-3 17H4M13 17H20M14-36Q2-45 16-49"/></g><text x="55" y="282" font-size="24" fill="#243349" font-weight="700">1 · Aufrüstung</text><text x="55" y="323" font-size="19" fill="#243349" font-weight="400">Staat A baut mehr</text><text x="55" y="352" font-size="19" fill="#243349" font-weight="400">Kriegsschiffe.</text><text x="325" y="301" font-size="29" fill="#af4d28" font-weight="700">→</text><rect x="345" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(488 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M0-33 36 30H-36Z"/><path d="M0-13V10M0 20V23"/></g><text x="365" y="282" font-size="24" fill="#243349" font-weight="700">2 · Bedrohungsgefühl</text><text x="365" y="323" font-size="19" fill="#243349" font-weight="400">Staat B fühlt sich</text><text x="365" y="352" font-size="19" fill="#243349" font-weight="400">unterlegen.</text><text x="635" y="301" font-size="29" fill="#af4d28" font-weight="700">→</text><rect x="655" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(798 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-33 9H33L21 29H-20ZM-8 8V-28L18-3H-8M-38 36Q-25 28-12 36T14 36T40 36"/></g><text x="675" y="282" font-size="24" fill="#243349" font-weight="700">3 · Gegenrüstung</text><text x="675" y="323" font-size="19" fill="#243349" font-weight="400">Staat B rüstet auf.</text><text x="675" y="352" font-size="19" fill="#243349" font-weight="400">A fühlt sich bedroht.</text><text x="40" y="540" font-size="13" fill="#687484" font-weight="400">LERNORIX · Eigenes Lernbild · schematisch</text></g></svg>