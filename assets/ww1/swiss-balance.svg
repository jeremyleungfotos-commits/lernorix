<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img"><title>Zwischen den Krieg führenden Nachbarn</title><desc>Vereinfachtes Denkbild, keine geografische Karte.</desc><rect width="960" height="560" rx="22" fill="#f5f2eb"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="30" fill="#243349" font-weight="700">Zwischen den Krieg führenden Nachbarn</text><text x="40" y="85" font-size="17" fill="#5b6878" font-weight="400">Vereinfachtes Denkbild, keine geografische Karte.</text><rect x="35" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(178 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-25 30V-30M-24-28H26L17-10 26 6H-24"/></g><text x="55" y="282" font-size="24" fill="#243349" font-weight="700">Deutschschweiz</text><text x="55" y="323" font-size="19" fill="#243349" font-weight="400">Viele Sympathien für</text><text x="55" y="352" font-size="19" fill="#243349" font-weight="400">Deutschland und</text><text x="55" y="381" font-size="19" fill="#243349" font-weight="400">Österreich-Ungarn</text><text x="325" y="301" font-size="29" fill="#af4d28" font-weight="700">→</text><rect x="345" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(488 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M0-32 28-20V2Q25 25 0 36Q-25 25-28 2V-20Z"/><path d="M-13 0H13M0-13V13"/></g><text x="365" y="282" font-size="24" fill="#243349" font-weight="700">Schweiz</text><text x="365" y="323" font-size="19" fill="#243349" font-weight="400">Keine Kriegspartei</text><text x="365" y="352" font-size="19" fill="#243349" font-weight="400">Grenzen schützen</text><text x="365" y="381" font-size="19" fill="#243349" font-weight="400">Zusammenhalt wahren</text><text x="635" y="301" font-size="29" fill="#af4d28" font-weight="700">→</text><rect x="655" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(798 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-25 30V-30M-24-28H26L17-10 26 6H-24"/></g><text x="675" y="282" font-size="24" fill="#243349" font-weight="700">Westschweiz</text><text x="675" y="323" font-size="19" fill="#243349" font-weight="400">Viele Sympathien</text><text x="675" y="352" font-size="19" fill="#243349" font-weight="400">für Frankreich</text><text x="675" y="381" font-size="19" fill="#243349" font-weight="400">und die Entente</text><text x="40" y="540" font-size="13" fill="#687484" font-weight="400">LERNORIX · Eigenes Lernbild · schematisch</text></g></svg>