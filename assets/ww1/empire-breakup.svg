<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img"><title>Österreich-Ungarn zerfällt</title><desc>Herbst 1918 und die Nachkriegsordnung – Beispiele, keine Grenzkarte.</desc><rect width="960" height="560" rx="22" fill="#f5f2eb"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="30" fill="#243349" font-weight="700">Österreich-Ungarn zerfällt</text><text x="40" y="85" font-size="17" fill="#5b6878" font-weight="400">Herbst 1918 und die Nachkriegsordnung – Beispiele, keine Grenzkarte.</text><rect x="35" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(178 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-30-15-18 16H18L30-15 10-2 0-28-10-2Z"/><path d="M-20 26H20"/></g><text x="55" y="282" font-size="24" fill="#243349" font-weight="700">Vielvölkerreich</text><text x="55" y="323" font-size="19" fill="#243349" font-weight="400">Ein Staat unter den</text><text x="55" y="352" font-size="19" fill="#243349" font-weight="400">Habsburgern mit vielen</text><text x="55" y="381" font-size="19" fill="#243349" font-weight="400">Sprachen und Nationalitäten</text><text x="325" y="301" font-size="29" fill="#af4d28" font-weight="700">→</text><rect x="345" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(488 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cy="-19" r="12"/><path d="M-18 30V12Q0-5 18 12V30M-34 23V7M34 23V7"/><circle cx="-31" cy="-8" r="8"/><circle cx="31" cy="-8" r="8"/></g><text x="365" y="282" font-size="24" fill="#243349" font-weight="700">Neue Staaten</text><text x="365" y="323" font-size="19" fill="#243349" font-weight="400">Österreich und Ungarn</text><text x="365" y="352" font-size="19" fill="#243349" font-weight="400">Tschechoslowakei; Gebiete</text><text x="365" y="381" font-size="19" fill="#243349" font-weight="400">zum südslawischen Staat</text><text x="635" y="301" font-size="29" fill="#af4d28" font-weight="700">→</text><rect x="655" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(798 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="29"/><ellipse cx="0" cy="0" rx="12" ry="29"/><path d="M-27-10H27M-27 10H27"/></g><text x="675" y="282" font-size="24" fill="#243349" font-weight="700">Neue Zuordnungen</text><text x="675" y="323" font-size="19" fill="#243349" font-weight="400">Weitere Gebiete gehen</text><text x="675" y="352" font-size="19" fill="#243349" font-weight="400">an Polen, Italien</text><text x="675" y="381" font-size="19" fill="#243349" font-weight="400">und Rumänien.</text><text x="40" y="540" font-size="13" fill="#687484" font-weight="400">LERNORIX · Eigenes Lernbild · schematisch</text></g></svg>