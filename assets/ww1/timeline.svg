<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>Die fünf Prüfungsdaten</title><desc>Monat und Jahr lernen – die genaue Bedeutung mitdenken.</desc><rect width="960" height="600" rx="22" fill="#f5f2eb"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="30" fill="#243349" font-weight="700">Die fünf Prüfungsdaten</text><text x="40" y="85" font-size="17" fill="#5b6878" font-weight="400">Monat und Jahr lernen – die genaue Bedeutung mitdenken.</text><path d="M64 135V216" stroke="#c5cbd0" stroke-width="4"/><circle cx="64" cy="135" r="10" fill="#af4d28"/><text x="94" y="143" font-size="23" fill="#af4d28" font-weight="700">Juli 1914</text><text x="355" y="143" font-size="23" fill="#243349" font-weight="700">Kriegsbeginn</text><text x="355" y="170" font-size="18" fill="#5b6878" font-weight="400">Österreich-Ungarn → Serbien</text><path d="M64 216V297" stroke="#c5cbd0" stroke-width="4"/><circle cx="64" cy="216" r="10" fill="#af4d28"/><text x="94" y="224" font-size="23" fill="#af4d28" font-weight="700">Mai 1915</text><text x="355" y="224" font-size="23" fill="#243349" font-weight="700">Italien tritt ein</text><text x="355" y="251" font-size="18" fill="#5b6878" font-weight="400">Seite der Entente</text><path d="M64 297V378" stroke="#c5cbd0" stroke-width="4"/><circle cx="64" cy="297" r="10" fill="#af4d28"/><text x="94" y="305" font-size="23" fill="#af4d28" font-weight="700">April 1917</text><text x="355" y="305" font-size="23" fill="#243349" font-weight="700">USA treten ein</text><text x="355" y="332" font-size="18" fill="#5b6878" font-weight="400">Gegen Deutschland</text><path d="M64 378V459" stroke="#c5cbd0" stroke-width="4"/><circle cx="64" cy="378" r="10" fill="#af4d28"/><text x="94" y="386" font-size="23" fill="#af4d28" font-weight="700">Dezember 1917</text><text x="355" y="386" font-size="23" fill="#243349" font-weight="700">Russischer Waffenstillstand</text><text x="355" y="413" font-size="18" fill="#5b6878" font-weight="400">Frieden: März 1918</text><path d="M64 459V540" stroke="#c5cbd0" stroke-width="4"/><circle cx="64" cy="459" r="10" fill="#af4d28"/><text x="94" y="467" font-size="23" fill="#af4d28" font-weight="700">November 1918</text><text x="355" y="467" font-size="23" fill="#243349" font-weight="700">Waffenstillstand</text><text x="355" y="494" font-size="18" fill="#5b6878" font-weight="400">11. November: Westfront</text><text x="40" y="580" font-size="13" fill="#687484" font-weight="400">LERNORIX · Eigenes Lernbild · schematisch</text></g></svg>