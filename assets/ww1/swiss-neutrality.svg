<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img"><title>Warum bleibt die Schweiz neutral?</title><desc>Neutralität bedeutet Nichtteilnahme am Krieg – sie braucht auch Schutz.</desc><rect width="960" height="560" rx="22" fill="#f5f2eb"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="30" fill="#243349" font-weight="700">Warum bleibt die Schweiz neutral?</text><text x="40" y="85" font-size="17" fill="#5b6878" font-weight="400">Neutralität bedeutet Nichtteilnahme am Krieg – sie braucht auch Schutz.</text><rect x="35" y="112" width="435" height="178" rx="18" fill="#fff"/><g transform="translate(90 177) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-25-32H13L28-17V32H-25Z"/><path d="M12-31V-15H27M-14-3H16M-14 9H16M-14 21H7"/></g><text x="140" y="154" font-size="23" fill="#243349" font-weight="700">Aussenpolitische Linie</text><text x="140" y="190" font-size="19" fill="#243349" font-weight="400">Dauernde Neutralität seit 1815</text><text x="140" y="218" font-size="19" fill="#243349" font-weight="400">1914 erneut erklärt</text><rect x="490" y="112" width="435" height="178" rx="18" fill="#fff"/><g transform="translate(545 177) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cy="-19" r="12"/><path d="M-18 30V12Q0-5 18 12V30M-34 23V7M34 23V7"/><circle cx="-31" cy="-8" r="8"/><circle cx="31" cy="-8" r="8"/></g><text x="595" y="154" font-size="23" fill="#243349" font-weight="700">Innerer Zusammenhalt</text><text x="595" y="190" font-size="19" fill="#243349" font-weight="400">Unterschiedliche Sympathien</text><text x="595" y="218" font-size="19" fill="#243349" font-weight="400">in den Sprachregionen</text><rect x="35" y="310" width="435" height="178" rx="18" fill="#fff"/><g transform="translate(90 375) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M0-32 28-20V2Q25 25 0 36Q-25 25-28 2V-20Z"/><path d="M-13 0H13M0-13V13"/></g><text x="140" y="352" font-size="23" fill="#243349" font-weight="700">Grenzschutz</text><text x="140" y="388" font-size="19" fill="#243349" font-weight="400">Armee wird mobilisiert</text><text x="140" y="416" font-size="19" fill="#243349" font-weight="400">Bewaffnete Neutralität</text><rect x="490" y="310" width="435" height="178" rx="18" fill="#fff"/><g transform="translate(545 375) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-32 20V-4Q-30-28 0-28Q30-28 32-4V20Z"/><path d="m-15-17-6 15m21-18-6 15m21-12-6 15M-31 11H31"/></g><text x="595" y="352" font-size="23" fill="#243349" font-weight="700">Trotzdem betroffen</text><text x="595" y="388" font-size="19" fill="#243349" font-weight="400">Versorgung wird schwierig</text><text x="595" y="416" font-size="19" fill="#243349" font-weight="400">Soziale Spannungen wachsen</text><text x="40" y="540" font-size="13" fill="#687484" font-weight="400">LERNORIX · Eigenes Lernbild · schematisch</text></g></svg>