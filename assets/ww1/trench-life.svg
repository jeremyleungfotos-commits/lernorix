<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img"><title>Leben im Schützengraben</title><desc>Nicht jeder Tag ist ein Angriff – die Belastung bleibt.</desc><rect width="960" height="560" rx="22" fill="#f5f2eb"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="30" fill="#243349" font-weight="700">Leben im Schützengraben</text><text x="40" y="85" font-size="17" fill="#5b6878" font-weight="400">Nicht jeder Tag ist ein Angriff – die Belastung bleibt.</text><rect x="35" y="112" width="435" height="178" rx="18" fill="#fff"/><g transform="translate(90 177) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M0-33 36 30H-36Z"/><path d="M0-13V10M0 20V23"/></g><text x="140" y="154" font-size="23" fill="#243349" font-weight="700">Ständige Gefahr</text><text x="140" y="190" font-size="19" fill="#243349" font-weight="400">Artillerie, Schüsse und Gas</text><text x="140" y="218" font-size="19" fill="#243349" font-weight="400">Verletzungen und Todesangst</text><rect x="490" y="112" width="435" height="178" rx="18" fill="#fff"/><g transform="translate(545 177) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-32 20V-4Q-30-28 0-28Q30-28 32-4V20Z"/><path d="m-15-17-6 15m21-18-6 15m21-12-6 15M-31 11H31"/></g><text x="595" y="154" font-size="23" fill="#243349" font-weight="700">Körperliche Not</text><text x="595" y="190" font-size="19" fill="#243349" font-weight="400">Nässe, Kälte, Schlamm</text><text x="595" y="218" font-size="19" fill="#243349" font-weight="400">Ungeziefer und Krankheiten</text><rect x="35" y="310" width="435" height="178" rx="18" fill="#fff"/><g transform="translate(90 375) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle r="31"/><path d="M0-20V0L16 10"/></g><text x="140" y="352" font-size="23" fill="#243349" font-weight="700">Warten und Arbeiten</text><text x="140" y="388" font-size="19" fill="#243349" font-weight="400">Wache, Reparaturen, Nachschub</text><text x="140" y="416" font-size="19" fill="#243349" font-weight="400">Wenig Schlaf und Erholung</text><rect x="490" y="310" width="435" height="178" rx="18" fill="#fff"/><g transform="translate(545 375) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cy="-19" r="12"/><path d="M-18 30V12Q0-5 18 12V30M-34 23V7M34 23V7"/><circle cx="-31" cy="-8" r="8"/><circle cx="31" cy="-8" r="8"/></g><text x="595" y="352" font-size="23" fill="#243349" font-weight="700">Psychische Belastung</text><text x="595" y="388" font-size="19" fill="#243349" font-weight="400">Angst, Erschöpfung und Trauer</text><text x="595" y="416" font-size="19" fill="#243349" font-weight="400">Kameradschaft als Stütze</text><text x="40" y="540" font-size="13" fill="#687484" font-weight="400">LERNORIX · Eigenes Lernbild · schematisch</text></g></svg>