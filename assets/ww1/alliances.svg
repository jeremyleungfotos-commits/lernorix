<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img"><title>Bündnisse verändern sich</title><desc>Vor dem Krieg geschlossene Verträge ≠ tatsächliche Kriegsparteien.</desc><rect width="960" height="560" rx="22" fill="#f5f2eb"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="30" fill="#243349" font-weight="700">Bündnisse verändern sich</text><text x="40" y="85" font-size="17" fill="#5b6878" font-weight="400">Vor dem Krieg geschlossene Verträge ≠ tatsächliche Kriegsparteien.</text><rect x="35" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(178 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-5-14 5-24Q25-42 35-19Q39-9 26 4L14 16M5 14-5 24Q-25 42-35 19Q-39 9-26-4L-14-16M-17 17 17-17"/></g><text x="55" y="282" font-size="24" fill="#243349" font-weight="700">Vor 1914</text><text x="55" y="323" font-size="19" fill="#243349" font-weight="400">Dreibund: Deutschland,</text><text x="55" y="352" font-size="19" fill="#243349" font-weight="400">Österreich-Ungarn, Italien</text><text x="325" y="301" font-size="29" fill="#af4d28" font-weight="700">→</text><rect x="345" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(488 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M0-32 28-20V2Q25 25 0 36Q-25 25-28 2V-20Z"/><path d="M-13 0H13M0-13V13"/></g><text x="365" y="282" font-size="24" fill="#243349" font-weight="700">1914</text><text x="365" y="323" font-size="19" fill="#243349" font-weight="400">Italien bleibt neutral.</text><text x="365" y="352" font-size="19" fill="#243349" font-weight="400">Entente-Kern: Frankreich,</text><text x="365" y="381" font-size="19" fill="#243349" font-weight="400">Grossbritannien, Russland</text><text x="635" y="301" font-size="29" fill="#af4d28" font-weight="700">→</text><rect x="655" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(798 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-25 30V-30M-24-28H26L17-10 26 6H-24"/></g><text x="675" y="282" font-size="24" fill="#243349" font-weight="700">Ab Mai 1915</text><text x="675" y="323" font-size="19" fill="#243349" font-weight="400">Italien kämpft gegen</text><text x="675" y="352" font-size="19" fill="#243349" font-weight="400">Österreich-Ungarn auf</text><text x="675" y="381" font-size="19" fill="#243349" font-weight="400">Seite der Entente.</text><text x="40" y="540" font-size="13" fill="#687484" font-weight="400">LERNORIX · Eigenes Lernbild · schematisch</text></g></svg>