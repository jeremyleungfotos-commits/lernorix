<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img"><title>Versailles: Bedingungen und Folgen</title><desc>Für Deutschland – nicht der Vertrag über die Aufteilung Österreich-Ungarns.</desc><rect width="960" height="560" rx="22" fill="#f5f2eb"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="30" fill="#243349" font-weight="700">Versailles: Bedingungen und Folgen</text><text x="40" y="85" font-size="17" fill="#5b6878" font-weight="400">Für Deutschland – nicht der Vertrag über die Aufteilung Österreich-Ungarns.</text><rect x="35" y="112" width="435" height="178" rx="18" fill="#fff"/><g transform="translate(90 177) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="29"/><ellipse cx="0" cy="0" rx="12" ry="29"/><path d="M-27-10H27M-27 10H27"/></g><text x="140" y="154" font-size="23" fill="#243349" font-weight="700">Gebietsverluste</text><text x="140" y="190" font-size="19" fill="#243349" font-weight="400">z. B. Elsass-Lothringen → FR</text><text x="140" y="218" font-size="19" fill="#243349" font-weight="400">Menschen und Ressourcen weg</text><rect x="490" y="112" width="435" height="178" rx="18" fill="#fff"/><g transform="translate(545 177) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M0-32 28-20V2Q25 25 0 36Q-25 25-28 2V-20Z"/><path d="M-13 0H13M0-13V13"/></g><text x="595" y="154" font-size="23" fill="#243349" font-weight="700">Abrüstung</text><text x="595" y="190" font-size="19" fill="#243349" font-weight="400">Heer: höchstens 100 000 Mann</text><text x="595" y="218" font-size="19" fill="#243349" font-weight="400">Militärische Macht begrenzt</text><rect x="35" y="310" width="435" height="178" rx="18" fill="#fff"/><g transform="translate(90 375) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-25-32H13L