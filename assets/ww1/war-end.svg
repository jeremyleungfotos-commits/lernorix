<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img"><title>Warum endet der Krieg 1918?</title><desc>Drei Gründe, die einander verstärken – erkläre jeweils die Wirkung.</desc><rect width="960" height="560" rx="22" fill="#f5f2eb"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="30" fill="#243349" font-weight="700">Warum endet der Krieg 1918?</text><text x="40" y="85" font-size="17" fill="#5b6878" font-weight="400">Drei Gründe, die einander verstärken – erkläre jeweils die Wirkung.</text><rect x="35" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(178 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-30 28V-7L-10 4V-7L10 4V-27H23V28Z"/><path d="M-17 17H-10M-3 17H4M13 17H20M14-36Q2-45 16-49"/></g><text x="55" y="282" font-size="24" fill="#243349" font-weight="700">Militärisch erschöpft</text><text x="55" y="323" font-size="19" fill="#243349" font-weight="400">Deutsche Offensive scheitert.</text><text x="55" y="352" font-size="19" fill="#243349" font-weight="400">Alliierte Gegenangriffe,</text><text x="55" y="381" font-size="19" fill="#243349" font-weight="400">US-Soldaten und Material</text><text x="325" y="301" font-size="29" fill="#af4d28" font-weight="700">→</text><rect x="345" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(488 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-32 20V-4Q-30-28 0-28Q30-28 32-4V20Z"/><path d="m-15-17-6 15m21-18-6 15m21-12-6 15M-31 11H31"/></g><text x="365" y="282" font-size="24" fill="#243349" font-weight="700">Versorgung in der Krise</text><text x="365" y="323" font-size="19" fill="#243349" font-weight="400">Blockade und Kriegswirtschaft</text><text x="365" y="352" font-size="19" fill="#243349" font-weight="400">Hunger und Mangel</text><text x="365" y="381" font-size="19" fill="#243349" font-weight="400">schwächen die Heimat.</text><text x="635" y="301" font-size="29" fill="#af4d28" font-weight="700">→</text><rect x="655" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(798 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cy="-19" r="12"/><path d="M-18 30V12Q0-5 18 12V30M-34 23V7M34 23V7"/><circle cx="-31" cy="-8" r="8"/><circle cx="31" cy="-8" r="8"/></g><text x="675" y="282" font-size="24" fill="#243349" font-weight="700">Politischer Zerfall</text><text x="675" y="323" font-size="19" fill="#243349" font-weight="400">Verbündete scheiden aus.</text><text x="675" y="352" font-size="19" fill="#243349" font-weight="400">Meutereien und Revolution</text><text x="675" y="381" font-size="19" fill="#243349" font-weight="400">erzwingen einen Kurswechsel.</text><text x="40" y="540" font-size="13" fill="#687484" font-weight="400">LERNORIX · Eigenes Lernbild · schematisch</text></g></svg>