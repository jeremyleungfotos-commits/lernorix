<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img"><title>Ordne die Ereignisse</title><desc>Nenne die richtige Reihenfolge und jeweils Monat und Jahr.</desc><rect width="960" height="560" rx="22" fill="#f5f2eb"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="30" fill="#243349" font-weight="700">Ordne die Ereignisse</text><text x="40" y="85" font-size="17" fill="#5b6878" font-weight="400">Nenne die richtige Reihenfolge und jeweils Monat und Jahr.</text><rect x="35" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(178 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-25 30V-30M-24-28H26L17-10 26 6H-24"/></g><text x="55" y="282" font-size="24" fill="#243349" font-weight="700">A · USA treten ein</text><text x="55" y="323" font-size="19" fill="#243349" font-weight="400">Ein neuer Kriegsteilnehmer</text><text x="55" y="352" font-size="19" fill="#243349" font-weight="400">auf alliierter Seite</text><text x="325" y="301" font-size="29" fill="#af4d28" font-weight="700">→</text><rect x="345" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(488 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-30 13Q-10 8-24-24Q0-13 8 3Q19-20 30-10L40-7 30-3Q22 24 2 23L-24 31-15 18Z"/></g><text x="365" y="282" font-size="24" fill="#243349" font-weight="700">B · Waffenstillstand</text><text x="365" y="323" font-size="19" fill="#243349" font-weight="400">Die Kämpfe an der</text><text x="365" y="352" font-size="19" fill="#243349" font-weight="400">Westfront enden.</text><text x="635" y="301" font-size="29" fill="#af4d28" font-weight="700">→</text><rect x="655" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(798 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="-31" y="-23" width="62" height="46" rx="4"/><path d="M-30-21 0 4 30-21M-30 21-9 0M30 21 9 0"/></g><text x="675" y="282" font-size="24" fill="#243349" font-weight="700">C · Kriegserklärung</text><text x="675" y="323" font-size="19" fill="#243349" font-weight="400">Österreich-Ungarn</text><text x="675" y="352" font-size="19" fill="#243349" font-weight="400">erklärt Serbien den Krieg.</text><text x="40" y="540" font-size="13" fill="#687484" font-weight="400">LERNORIX · Eigenes Lernbild · schematisch</text></g></svg>