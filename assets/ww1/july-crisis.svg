<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img"><title>Entscheidungen machen die Krise grösser</title><desc>Keine automatische Maschine: Regierungen treffen folgenreiche Entscheidungen.</desc><rect width="960" height="560" rx="22" fill="#f5f2eb"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="30" fill="#243349" font-weight="700">Entscheidungen machen die Krise grösser</text><text x="40" y="85" font-size="17" fill="#5b6878" font-weight="400">Keine automatische Maschine: Regierungen treffen folgenreiche Entscheidungen.</text><rect x="35" y="112" width="435" height="178" rx="18" fill="#fff"/><g transform="translate(90 177) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-5-14 5-24Q25-42 35-19Q39-9 26 4L14 16M5 14-5 24Q-25 42-35 19Q-39 9-26-4L-14-16M-17 17 17-17"/></g><text x="140" y="154" font-size="23" fill="#243349" font-weight="700">Deutschland</text><text x="140" y="190" font-size="19" fill="#243349" font-weight="400">Unterstützt Österreich-Ungarn</text><text x="140" y="218" font-size="19" fill="#243349" font-weight="400">Auch bei Eskalationsgefahr</text><rect x="490" y="112" width="435" height="178" rx="18" fill="#fff"/><g transform="translate(545 177) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M0-32 28-20V2Q25 25 0 36Q-25 25-28 2V-20Z"/><path d="M-13 0H13M0-13V13"/></g><text x="595" y="154" font-size="23" fill="#243349" font-weight="700">Russland</text><text x="595" y="190" font-size="19" fill="#243349" font-weight="400">Unterstützt Serbien</text><text x="595" y="218" font-size="19" fill="#243349" font-weight="400">Mobilisiert seine Armee</text><rect x="35" y="310" width="435" height="178" rx="18" fill="#fff"/><g transform="translate(90 375) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-25 30V-30M-24-28H26L17-10 26 6H-24"/></g><text x="140" y="352" font-size="23" fill="#243349" font-weight="700">Frankreich</text><text x="140" y="388" font-size="19" fill="#243349" font-weight="400">Ist mit Russland verbündet</text><text x="140" y="416" font-size="19" fill="#243349" font-weight="400">Wird in den Krieg einbezogen</text><rect x="490" y="310" width="435" height="178" rx="18" fill="#fff"/><g transform="translate(545 375) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-33 9H33L21 29H-20ZM-8 8V-28L18-3H-8M-38 36Q-25 28-12 36T14 36T40 36"/></g><text x="595" y="352" font-size="23" fill="#243349" font-weight="700">Grossbritannien</text><text x="595" y="388" font-size="19" fill="#243349" font-weight="400">Deutscher Einmarsch in Belgien</text><text x="595" y="416" font-size="19" fill="#243349" font-weight="400">Kriegseintritt im August 1914</text><text x="40" y="540" font-size="13" fill="#687484" font-weight="400">LERNORIX · Eigenes Lernbild · schematisch</text></g></svg>