<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img"><title>1917: zwei Veränderungen</title><desc>Die Folgen wirken zeitversetzt – der Krieg endet nicht sofort.</desc><rect width="960" height="560" rx="22" fill="#f5f2eb"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="30" fill="#243349" font-weight="700">1917: zwei Veränderungen</text><text x="40" y="85" font-size="17" fill="#5b6878" font-weight="400">Die Folgen wirken zeitversetzt – der Krieg endet nicht sofort.</text><rect x="35" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(178 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-25 30V-30M-24-28H26L17-10 26 6H-24"/></g><text x="55" y="282" font-size="24" fill="#243349" font-weight="700">USA treten ein</text><text x="55" y="323" font-size="19" fill="#243349" font-weight="400">April 1917</text><text x="55" y="352" font-size="19" fill="#243349" font-weight="400">Neue Soldaten und Material</text><text x="55" y="381" font-size="19" fill="#243349" font-weight="400">stärken die Alliierten.</text><text x="325" y="301" font-size="29" fill="#af4d28" font-weight="700">→</text><rect x="345" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(488 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M0-33 36 30H-36Z"/><path d="M0-13V10M0 20V23"/></g><text x="365" y="282" font-size="24" fill="#243349" font-weight="700">Russland scheidet aus</text><text x="365" y="323" font-size="19" fill="#243349" font-weight="400">Waffenstillstand: Dez. 1917</text><text x="365" y="352" font-size="19" fill="#243349" font-weight="400">Frieden: März 1918</text><text x="365" y="381" font-size="19" fill="#243349" font-weight="400">Die Ostfront wird entlastet.</text><text x="635" y="301" font-size="29" fill="#af4d28" font-weight="700">→</text><rect x="655" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(798 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle r="31"/><path d="M0-20V0L16 10"/></g><text x="675" y="282" font-size="24" fill="#243349" font-weight="700">1918 entscheidet sich</text><text x="675" y="323" font-size="19" fill="#243349" font-weight="400">Deutsche Offensive scheitert.</text><text x="675" y="352" font-size="19" fill="#243349" font-weight="400">Alliierte gewinnen die Initiative.</text><text x="675" y="381" font-size="19" fill="#243349" font-weight="400">Waffenstillstand im November.</text><text x="40" y="540" font-size="13" fill="#687484" font-weight="400">LERNORIX · Eigenes Lernbild · schematisch</text></g></svg>