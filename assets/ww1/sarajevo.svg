<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img"><title>Vom Attentat zum Krieg</title><desc>Das Attentat ist der Auslöser; die Ursachen bestehen schon länger.</desc><rect width="960" height="560" rx="22" fill="#f5f2eb"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="30" fill="#243349" font-weight="700">Vom Attentat zum Krieg</text><text x="40" y="85" font-size="17" fill="#5b6878" font-weight="400">Das Attentat ist der Auslöser; die Ursachen bestehen schon länger.</text><rect x="35" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(178 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle r="30"/><circle r="18"/><circle r="5"/><path d="M-36 0H36M0-36V36"/></g><text x="55" y="282" font-size="24" fill="#243349" font-weight="700">28. Juni 1914</text><text x="55" y="323" font-size="19" fill="#243349" font-weight="400">Sarajevo: Franz Ferdinand</text><text x="55" y="352" font-size="19" fill="#243349" font-weight="400">und Sophie werden</text><text x="55" y="381" font-size="19" fill="#243349" font-weight="400">von Gavrilo Princip getötet.</text><text x="325" y="301" font-size="29" fill="#af4d28" font-weight="700">→</text><rect x="345" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(488 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="-31" y="-23" width="62" height="46" rx="4"/><path d="M-30-21 0 4 30-21M-30 21-9 0M30 21 9 0"/></g><text x="365" y="282" font-size="24" fill="#243349" font-weight="700">Juli 1914</text><text x="365" y="323" font-size="19" fill="#243349" font-weight="400">Österreich-Ungarn stellt</text><text x="365" y="352" font-size="19" fill="#243349" font-weight="400">Serbien ein Ultimatum.</text><text x="365" y="381" font-size="19" fill="#243349" font-weight="400">Deutschland gibt Rückhalt.</text><text x="635" y="301" font-size="29" fill="#af4d28" font-weight="700">→</text><rect x="655" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(798 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M0-33 36 30H-36Z"/><path d="M0-13V10M0 20V23"/></g><text x="675" y="282" font-size="24" fill="#243349" font-weight="700">28. Juli 1914</text><text x="675" y="323" font-size="19" fill="#243349" font-weight="400">Österreich-Ungarn erklärt</text><text x="675" y="352" font-size="19" fill="#243349" font-weight="400">Serbien den Krieg.</text><text x="675" y="381" font-size="19" fill="#243349" font-weight="400">Die Krise weitet sich aus.</text><text x="40" y="540" font-size="13" fill="#687484" font-weight="400">LERNORIX · Eigenes Lernbild · schematisch</text></g></svg>