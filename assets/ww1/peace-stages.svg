<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img"><title>Waffenstillstand ist noch kein Friedensvertrag</title><desc>Ein Datum beschreibt die Kampfpause, ein anderes die Friedensbedingungen.</desc><rect width="960" height="560" rx="22" fill="#f5f2eb"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="30" fill="#243349" font-weight="700">Waffenstillstand ist noch kein Friedensvertrag</text><text x="40" y="85" font-size="17" fill="#5b6878" font-weight="400">Ein Datum beschreibt die Kampfpause, ein anderes die Friedensbedingungen.</text><rect x="35" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(178 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-30 13Q-10 8-24-24Q0-13 8 3Q19-20 30-10L40-7 30-3Q22 24 2 23L-24 31-15 18Z"/></g><text x="55" y="282" font-size="24" fill="#243349" font-weight="700">11. November 1918</text><text x="55" y="323" font-size="19" fill="#243349" font-weight="400">Waffenstillstand mit</text><text x="55" y="352" font-size="19" fill="#243349" font-weight="400">Deutschland</text><text x="55" y="381" font-size="19" fill="#243349" font-weight="400">Kämpfe an der Westfront enden.</text><text x="325" y="301" font-size="29" fill="#af4d28" font-weight="700">→</text><rect x="345" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(488 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-25-32H13L28-17V32H-25Z"/><path d="M12-31V-15H27M-14-3H16M-14 9H16M-14 21H7"/></g><text x="365" y="282" font-size="24" fill="#243349" font-weight="700">28. Juni 1919</text><text x="365" y="323" font-size="19" fill="#243349" font-weight="400">Versailler Vertrag</text><text x="365" y="352" font-size="19" fill="#243349" font-weight="400">mit Deutschland</text><text x="365" y="381" font-size="19" fill="#243349" font-weight="400">Unterzeichnung</text><text x="635" y="301" font-size="29" fill="#af4d28" font-weight="700">→</text><rect x="655" y="135" width="285" height="320" rx="18" fill="#fff"/><g transform="translate(798 202) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle r="31"/><path d="M0-20V0L16 10"/></g><text x="675" y="282" font-size="24" fill="#243349" font-weight="700">10. Januar 1920</text><text x="675" y="323" font-size="19" fill="#243349" font-weight="400">Versailler Vertrag</text><text x="675" y="352" font-size="19" fill="#243349" font-weight="400">tritt in Kraft.</text><text x="675" y="381" font-size="19" fill="#243349" font-weight="400">Andere Staaten: eigene Verträge</text><text x="40" y="540" font-size="13" fill="#687484" font-weight="400">LERNORIX · Eigenes Lernbild · schematisch</text></g></svg>