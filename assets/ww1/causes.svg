<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img"><title>Warum steigt die Kriegsgefahr?</title><desc>Vier längerfristige Entwicklungen – zusammen erklären sie die Spannungen.</desc><rect width="960" height="560" rx="22" fill="#f5f2eb"/><g font-family="Arial, sans-serif"><text x="40" y="52" font-size="30" fill="#243349" font-weight="700">Warum steigt die Kriegsgefahr?</text><text x="40" y="85" font-size="17" fill="#5b6878" font-weight="400">Vier längerfristige Entwicklungen – zusammen erklären sie die Spannungen.</text><rect x="35" y="112" width="435" height="178" rx="18" fill="#fff"/><g transform="translate(90 177) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-25 30V-30M-24-28H26L17-10 26 6H-24"/></g><text x="140" y="154" font-size="23" fill="#243349" font-weight="700">Nationalismus</text><text x="140" y="190" font-size="19" fill="#243349" font-weight="400">Eigene Nation überhöhen</text><text x="140" y="218" font-size="19" fill="#243349" font-weight="400">Andere abwerten</text><rect x="490" y="112" width="435" height="178" rx="18" fill="#fff"/><g transform="translate(545 177) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="29"/><ellipse cx="0" cy="0" rx="12" ry="29"/><path d="M-27-10H27M-27 10H27"/></g><text x="595" y="154" font-size="23" fill="#243349" font-weight="700">Imperialismus</text><text x="595" y="190" font-size="19" fill="#243349" font-weight="400">Kolonien, Macht und Märkte</text><text x="595" y="218" font-size="19" fill="#243349" font-weight="400">Konkurrenz der Grossmächte</text><rect x="35" y="310" width="435" height="178" rx="18" fill="#fff"/><g transform="translate(90 375) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-30 28V-7L-10 4V-7L10 4V-27H23V28Z"/><path d="M-17 17H-10M-3 17H4M13 17H20M14-36Q2-45 16-49"/></g><text x="140" y="352" font-size="23" fill="#243349" font-weight="700">Militarismus</text><text x="140" y="388" font-size="19" fill="#243349" font-weight="400">Aufrüsten und Kriegspläne</text><text x="140" y="416" font-size="19" fill="#243349" font-weight="400">Vertrauen auf militärische Macht</text><rect x="490" y="310" width="435" height="178" rx="18" fill="#fff"/><g transform="translate(545 375) scale(1)" stroke="#af4d28" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-5-14 5-24Q25-42 35-19Q39-9 26 4L14 16M5 14-5 24Q-25 42-35 19Q-39 9-26-4L-14-16M-17 17 17-17"/></g><text x="595" y="352" font-size="23" fill="#243349" font-weight="700">Bündnisse</text><text x="595" y="388" font-size="19" fill="#243349" font-weight="400">Rückhalt – aber auch Risiko</text><text x="595" y="416" font-size="19" fill="#243349" font-weight="400">Ein Konflikt kann sich ausweiten</text><text x="40" y="540" font-size="13" fill="#687484" font-weight="400">LERNORIX · Eigenes Lernbild · schematisch</text></g></svg>